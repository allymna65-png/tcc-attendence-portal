<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Attendance Portal</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script>tailwind.config={theme:{extend:{colors:{navy:'#0b1f3a'}}}}</script><style>body{font-family:Inter,ui-sans-serif,system-ui;background:#f1f5f9}.leaflet-container{height:320px;border-radius:18px}.hiddenx{display:none!important}</style></head><body><div id="app"></div><script>
const HQ=[-5.0681,39.0982], WA='https://wa.me/255710082844?text=Hello%20HR%20Admin,%20I%20have%20an%20inquiry%20regarding%20the%20TCC%20Attendance%20Portal.';let state=JSON.parse(localStorage.tccState||'null');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.tccState=JSON.stringify(state)}
function shell(title,sub,body){app.innerHTML=`<div class="min-h-screen bg-gradient-to-br from-slate-950 via-navy to-slate-900 p-4 flex items-center justify-center"><div class="w-full max-w-6xl bg-white rounded-3xl overflow-hidden shadow-2xl grid md:grid-cols-2"><div class="hidden md:block bg-navy text-white p-12"><div class="text-2xl font-black">TCC <span class="text-emerald-400">ATTENDANCE</span></div><h1 class="text-4xl font-black mt-16 leading-tight">Secure attendance management for Tanga City Council.</h1><p class="text-slate-300 mt-5">GPS-aware attendance, HR approvals, leave controls, analytics and auditable reporting.</p><div class="grid grid-cols-2 gap-3 mt-12"><div class="bg-white/5 border border-white/10 rounded-2xl p-4">🛡️<br><b>Role-based access</b></div><div class="bg-white/5 border border-white/10 rounded-2xl p-4">📍<br><b>HQ geofence</b></div></div></div><div class="p-7 md:p-12"><p class="text-xs font-bold uppercase tracking-widest text-blue-700">Tanga City Council HQ · Road 18, Tanga</p><h2 class="text-2xl font-black mt-2">${title}</h2><p class="text-slate-500 text-sm mt-1">${sub}</p>${body}</div></div></div>`}
function input(label,id,type='text',req=true){return `<label class="block"><span class="text-xs font-bold uppercase text-slate-500">${label}</span><input id="${id}" type="${type}" ${req?'required':''} class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-700 focus:ring-2 focus:ring-blue-100"></label>`}
function login(){shell('Universal Login','Sign in with your official email or ID',`<form id="login" class="space-y-4 mt-7">${input('Email / ID','id')}${input('Password','pw','password')}<div id="err"></div><button class="w-full rounded-xl bg-navy text-white py-3 font-bold">Sign In</button><button type="button" id="forgot" class="w-full text-sm text-blue-700 font-semibold">Forgot Password?</button></form>`);document.querySelector('#login').onsubmit=e=>{e.preventDefault();let id=document.querySelector('#id').value,p=document.querySelector('#pw').value;if(!state){return setup()}if(id.toLowerCase()==='admin'&&p==='admin'){state.user={role:'ADMIN',name:'Primary HR Admin',id:'ADMIN'};save();admin()}else if(state.users?.find(u=>(u.id===id||u.email===id)&&u.password===p)){let u=state.users.find(u=>(u.id===id||u.email===id)&&u.password===p);state.user=u;save();u.mustReset?reset():portal()}else document.querySelector('#err').innerHTML='<div class="bg-red-50 text-red-700 p-3 rounded-xl text-sm">Invalid email/ID or password.</div>'};document.querySelector('#forgot').onclick=forgot}
function setup(){shell('Initial Setup: Create Primary HR Admin','One-time bootstrapping',`<form id="setup" class="space-y-4 mt-7">${input('Full Name','name')}${input('Official Email','email','email')}${input('Phone Number','phone')}${input('Password','password','password')}<div class="text-xs text-slate-500">Password: 8+ chars, uppercase, lowercase, number and special character.</div><button class="w-full rounded-xl bg-navy text-white py-3 font-bold">Create Primary HR Admin</button></form>`);document.querySelector('#setup').onsubmit=e=>{e.preventDefault();state={users:[],user:{role:'ADMIN',name:document.querySelector('#name').value,id:'ADMIN',email:document.querySelector('#email').value},radius:100,attendance:[],leaves:[],requests:[]};save();admin()}}
function reset(){shell('Mandatory Password Reset','Your temporary password must be replaced',`<form id="reset" class="space-y-4 mt-7">${input('New Password','np','password')}${input('Confirm Password','cp','password')}<button class="w-full rounded-xl bg-emerald-600 text-white py-3 font-bold">Set New Password</button></form>`);document.querySelector('#reset').onsubmit=e=>{e.preventDefault();let a=np.value,b=cp.value;if(a!==b||a.length<8||!/[A-Z]/.test(a)||!/[a-z]/.test(a)||!/\d/.test(a)||!/[^A-Za-z0-9]/.test(a))return alert('Password must meet all strength requirements.');let u=state.user;let x=state.users.find(v=>v.id===u.id);x.password=a;x.mustReset=false;state.user=x;save();portal()}}
function top(title){return `<header class="sticky top-0 z-20 bg-white border-b"><div class="h-16 px-4 md:px-6 flex items-center justify-between"><div class="flex items-center gap-3"><div class="h-10 w-10 rounded-xl bg-navy text-white grid place-items-center font-black">TCC</div><div><b>${title}</b><div class="text-xs text-slate-500">Tanga City Council HQ</div></div></div><button onclick="logout()" class="px-3 py-2 rounded-xl bg-slate-100 font-semibold">Logout</button></div></header>`}
function admin(){app.innerHTML=top('HR Attendance Control Center')+`<main class="p-4 md:p-6 max-w-7xl mx-auto space-y-5"><div><p class="text-sm font-bold text-blue-700">HR CONTROL CENTER</p><h1 class="text-3xl font-black">Attendance Overview</h1></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${card('Total Users',state.users.length,'👥')}${card('Today Attendance',state.attendance.filter(a=>a.date===new Date().toISOString().slice(0,10)).length,'✓')}${card('Late Arrivals',state.attendance.filter(a=>a.status==='Late').length,'◷')}${card('Pending Resets',state.requests.length,'🔑')}</div><div class="grid lg:grid-cols-3 gap-5"><section class="lg:col-span-2 bg-white rounded-2xl border p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="font-black text-lg">User Management</h2><p class="text-sm text-slate-500">HR Admin controlled onboarding only.</p></div><button onclick="addUser()" class="bg-emerald-600 text-white rounded-xl px-4 py-2 font-bold">+ Add User</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">ID</th><th class="p-3 text-left">Category</th><th class="p-3 text-left">Department</th></tr></thead><tbody>${state.users.map(u=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(u.name)}</td><td class="p-3">${esc(u.id)}</td><td class="p-3">${u.category==='STUDENT'?'Field Student':'Staff'}</td><td class="p-3">${esc(u.department)}</td></tr>`).join('')||'<tr><td colspan="4" class="p-8 text-center text-slate-500">No users yet.</td></tr>'}</tbody></table></div></section><section class="bg-white rounded-2xl border p-5"><h2 class="font-black text-lg">HQ Geofence</h2><p class="text-sm text-slate-500 mt-1">Center: -5.0681, 39.0982</p><div class="grid grid-cols-3 gap-2 mt-4">${[50,100,200].map(r=>`<button onclick="state.radius=${r};save();admin()" class="rounded-xl border p-3 font-bold ${state.radius===r?'bg-blue-50 border-blue-700 text-blue-700':''}">${r}m</button>`).join('')}</div><div id="map" class="mt-4"></div><div class="mt-4 p-3 rounded-xl bg-slate-50 text-xs">Late threshold: <b>07:30 AM</b> · GPS accuracy limit: <b>15m</b></div></section></div><div class="grid md:grid-cols-2 gap-5"><section class="bg-white rounded-2xl border p-5"><h2 class="font-black">Leave Requests</h2><p class="text-sm text-slate-500 mt-1">Approve or reject employee leave requests.</p>${state.leaves.map(l=>`<div class="mt-3 p-3 rounded-xl bg-slate-50"><b>${esc(l.name)}</b><br>${l.type}: ${l.start} → ${l.end}<br><span class="text-xs">${l.status}</span></div>`).join('')||'<p class="mt-4 text-sm text-slate-500">No leave requests.</p>'}</section><section class="bg-white rounded-2xl border p-5"><h2 class="font-black">Password Reset Approval Queue</h2>${state.requests.map((r,i)=>`<div class="mt-3 p-3 rounded-xl bg-amber-50 flex justify-between gap-3"><span><b>${esc(r.name)}</b><br><small>${esc(r.id)}</small></span><button onclick="approveReset(${i})" class="bg-emerald-600 text-white rounded-lg px-3 py-2 text-sm font-bold">Approve</button></div>`).join('')||'<p class="mt-4 text-sm text-slate-500">No pending requests.</p>'}</section></div></main>`;setTimeout(()=>{let m=L.map('map').setView(HQ,17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);L.marker(HQ).addTo(m).bindPopup('TCC HQ · Road 18, Tanga').openPopup();L.circle(HQ,{radius:state.radius,color:'#2563eb',fillOpacity:.12}).addTo(m)},50)}
function card(a,b,c){return `<div class="bg-white rounded-2xl border p-5"><div class="text-2xl">${c}</div><p class="text-sm text-slate-500 mt-3">${a}</p><p class="text-3xl font-black mt-1">${b}</p></div>`}
function addUser(){let name=prompt('Full Name');if(!name)return;let id=prompt('Staff / Registration ID');if(!id)return;let cat=(prompt('Category: STAFF or STUDENT','STAFF')||'STAFF').toUpperCase();let dep=prompt('Department','');let email=prompt('Email','');let u={name,id,category:cat==='STUDENT'?'STUDENT':'STAFF',department:dep,email,password:cat==='STUDENT'?'STD_123456':'STF_123456',mustReset:true};state.users.push(u);save();alert('Account created. Default password: '+u.password);admin()}
function approveReset(i){let r=state.requests[i],u=state.users.find(x=>x.id===r.id);if(u){u.password=u.category==='STUDENT'?'STD_123456':'STF_123456';u.mustReset=true}state.requests.splice(i,1);save();admin()}
function portal(){let u=state.user;app.innerHTML=top('Employee Portal')+`<main class="p-4 md:p-6 max-w-7xl mx-auto space-y-5"><div><p class="text-sm font-bold text-blue-700">EMPLOYEE PORTAL</p><h1 class="text-3xl font-black">Welcome, ${esc(u.name)}</h1><p class="text-slate-500">${u.category==='STUDENT'?'Field Student':'Staff Member'} · ${esc(u.id)} · ${esc(u.department)}</p></div><div class="grid md:grid-cols-3 gap-4">${card('Today',state.attendance.find(a=>a.id===u.id&&a.date===today())?.status||'Not checked in','✓')}${card('Attendance Rate','0%','◷')}${card('Leave Status','Active','📅')}</div><div class="grid lg:grid-cols-2 gap-5"><section class="bg-white rounded-2xl border p-5"><h2 class="font-black text-lg">Secure Attendance</h2><p class="text-sm text-slate-500 mt-1">Only within ${state.radius}m of TCC HQ and GPS accuracy ≤15m.</p><div class="grid grid-cols-2 gap-3 mt-5"><button onclick="punch('IN')" class="bg-emerald-600 text-white rounded-xl py-3 font-bold">📍 Check In</button><button onclick="punch('OUT')" class="bg-navy text-white rounded-xl py-3 font-bold">◷ Check Out</button></div><div id="gps" class="mt-4"></div></section><section class="bg-white rounded-2xl border p-5"><h2 class="font-black">My Attendance</h2><div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Date</th><th class="p-3">In</th><th class="p-3">Out</th><th class="p-3">Status</th></tr></thead><tbody>${state.attendance.filter(a=>a.id===u.id).map(a=>`<tr class="border-t"><td class="p-3">${a.date}</td><td class="p-3">${a.in||'—'}</td><td class="p-3">${a.out||'—'}</td><td class="p-3">${a.status}</td></tr>`).join('')||'<tr><td colspan="4" class="p-6 text-center text-slate-500">No records yet.</td></tr>'}</tbody></table></div></section></div></main><a href="${WA}" target="_blank" class="fixed bottom-5 right-5 h-14 w-14 rounded-full bg-[#25D366] text-white grid place-items-center text-2xl shadow-lg">☏</a>`}
function today(){return new Date().toISOString().slice(0,10)}
function punch(type){if(!navigator.geolocation)return alert('GPS is not available.');navigator.geolocation.getCurrentPosition(pos=>{let acc=pos.coords.accuracy;if(acc>15)return alert('Untrusted/Mock GPS Signal. Accuracy is '+Math.round(acc)+'m; maximum allowed is 15m.');let d=dist(HQ,[pos.coords.latitude,pos.coords.longitude]);if(d>state.radius)return alert('Outside TCC HQ geofence. Distance: '+Math.round(d)+'m.');let u=state.user,a=state.attendance.find(x=>x.id===u.id&&x.date===today());if(type==='IN'&&a)return alert('Check-in already recorded.');if(type==='OUT'&&!a)return alert('Check-in is required first.');if(type==='OUT'&&a.out)return alert('Check-out already recorded.');let now=new Date(),time=now.toTimeString().slice(0,5);if(type==='IN'){a={id:u.id,date:today(),in:time,status:time<='07:30'?'On Time':'Late',distance:Math.round(d)};state.attendance.push(a)}else a.out=time;save();document.getElementById('gps').innerHTML='<div class="bg-emerald-50 text-emerald-700 rounded-xl p-3 text-sm font-semibold">'+(type==='IN'?'Check-in':'Check-out')+' successful at '+time+'. GPS accuracy '+Math.round(acc)+'m.</div>';setTimeout(portal,900)},e=>alert('GPS error: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000})}
function dist(a,b){let R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function forgot(){shell('Password Reset Request','HR Admin approval workflow',`<form id="fr" class="space-y-4 mt-7">${input('Email / ID','fid')}<button class="w-full rounded-xl bg-navy text-white py-3 font-bold">Submit Request</button><button type="button" onclick="login()" class="w-full rounded-xl bg-slate-100 py-3 font-bold">Back to Login</button></form>`);fr.onsubmit=e=>{e.preventDefault();let id=fid.value,u=state?.users?.find(x=>x.id===id||x.email===id);if(u){state.requests.push({id:u.id,name:u.name});save()}alert('If the account exists, the request has been sent to HR Admin.');login()}}
function logout(){state.user=null;save();login()}
if(!state||!state.user){if(!state)setup();else login()}else if(state.user.role==='ADMIN')admin();else portal();
</script></body></html>
